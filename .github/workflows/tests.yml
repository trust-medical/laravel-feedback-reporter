name: Tests & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run so new advisories are caught between changes.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} (Testbench ${{ matrix.testbench }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --check-lock

      - name: Check for Security Advisories (Composer Audit)
        run: composer audit --locked

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Audit resolved dependencies
        run: composer audit

      - name: Execute Pest Tests
        run: vendor/bin/pest

      - name: Run PHPStan Analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Check Code Style with Pint
        run: vendor/bin/pint --test

  frontend-tests:
    name: Frontend - Node ${{ matrix.node }} (TypeScript, Vitest, Build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Lint with Biome
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Vitest
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Ensure committed dist is up to date
        if: matrix.node == 22
        run: git diff --exit-code --stat -- dist
