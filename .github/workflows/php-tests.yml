name: PHP Tests

# main only accepts changes through pull requests, so there is no push trigger:
# the pull request run covers the change and the weekly run covers main.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/frontend-tests.yml'
      - 'resources/js/**'
      - 'tests-js/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'vitest.config.ts'
      - '.dockerignore'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'Makefile'
  schedule:
    # Weekly run so new advisories and upstream releases are caught between changes.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} (Testbench ${{ matrix.testbench }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --check-lock

      - name: Check for Security Advisories (Composer Audit)
        run: composer audit --locked

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Audit resolved dependencies
        run: composer audit

      - name: Execute Pest Tests
        run: vendor/bin/pest

      - name: Run PHPStan Analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Check Code Style with Pint
        run: vendor/bin/pint --test
