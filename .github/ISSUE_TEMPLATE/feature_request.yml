name: Feature request
description: Propose a new feature or a change to existing behavior.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not include personal or confidential data in examples or screenshots.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include configuration or API examples if helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
