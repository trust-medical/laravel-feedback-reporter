name: Bug report
description: Report a reproducible problem with the Laravel package or the frontend SDK/Widget.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include personal or confidential data in screenshots, logs, metadata, or URLs. Redact them before posting.
        Report security vulnerabilities through the Security tab instead of this form.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal configuration and steps that reproduce the problem.
      placeholder: |
        1. Configure ...
        2. Open ...
        3. Submit ...
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: v4.2.1
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel and PHP versions
      placeholder: Laravel 13.x, PHP 8.4
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: Required for Widget or SDK issues.
      placeholder: Chrome 140, macOS 26
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      description: Redact personal or confidential data before pasting.
      render: text
